schema_version: 1
workspace_root: ../..

project:
  id: bw2-rbwe01
  display_name: RBWE01 rev 0
  game_id: RBWE01
  region: E
  base_manifest_format: bw2-recomp-base-manifest
  base_manifest_stem: bw2_base

memory:
  base: 0x80000000
  size: 0x01800000
  # __init_registers (0x80006290); match _SDA_BASE_/_SDA2_BASE_ in BW2.sel.
  sda_base: 0x80601160
  sda2_base: 0x80608EC0

inputs:
  dol:
    path: Assets/main.dol
    sha256: 9e557a6c9d316de3a3db8e9790b8d8c54ffc9cd1656dee89a90a2d7f964df87f

translation:
  entry_points:
    - 0x80006124
  # Generated by build.sh (projects/bw2/tools/bw2_function_map.py); not versioned.
  function_map:
    path: projects/bw2/MAP.txt

  # mfspr of hardware SPRs (L2CR, WPAR, PMCs, BATs) in MetroTRK and the PPC
  # intrinsics; the runtime replaces those functions or they never run.
  allow_unsupported_instructions: true

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/bw2_base_manifest.json
